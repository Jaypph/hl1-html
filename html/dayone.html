<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Half-Life: Day One</title>
    <style>
        html, body, canvas { width: 100%; height: 100%; margin: 0; }
        body { overflow: hidden; background: #000; color: #fff; font-family: Arial, sans-serif; }
        #status { position: fixed; z-index: 10; inset: 0; display: grid; place-items: center; background: #000; padding: 24px; text-align: center; }
        #panel { width: min(560px, 90vw); }
        #title { font-size: 22px; margin-bottom: 18px; }
        #message { font-size: 15px; min-height: 22px; white-space: pre-wrap; }
        #progress { height: 14px; background: #222; border: 1px solid #555; border-radius: 7px; overflow: hidden; margin: 14px 0 8px; }
        #bar { width: 0%; height: 100%; background: #fff; transition: width .15s ease; }
        #percent { font-size: 14px; }
        #status.error { color: #ff8a8a; }
        canvas { display: block; }
    </style>
</head>
<body>
    <div id="status">
        <div id="panel">
            <div id="title">Loading Half-Life: Day One…</div>
            <div id="message">Starting…</div>
            <div id="progress"><div id="bar"></div></div>
            <div id="percent">0%</div>
        </div>
    </div>
    <canvas id="canvas"></canvas>

    <script type="module">
        import JSZip from "https://esm.sh/jszip@3.10.1";
        import { Xash3D } from "https://esm.sh/xash3d-fwgs@1.2.2";

        const status = document.getElementById("status");
        const message = document.getElementById("message");
        const bar = document.getElementById("bar");
        const percent = document.getElementById("percent");
        const canvas = document.getElementById("canvas");
        const startedAt = performance.now();

        const ENGINE_BASE = "https://cdn.jsdelivr.net/npm/xash3d-fwgs@1.2.2/dist/";
        const HLSDK_BASE = "https://cdn.jsdelivr.net/npm/hlsdk-portable@0.1.3/dist/";
        const GAME_URL = "https://files.catbox.moe/todjxd.zip";
        const EXTRAS_URL = ENGINE_BASE + "valve/extras.pk3";

        const downloadProgress = { game: 0, extras: 0 };
        let engineReady = false;

        function progress(value, text) {
            const p = Math.max(0, Math.min(100, value));
            bar.style.width = p.toFixed(1) + "%";
            percent.textContent = Math.round(p) + "%";
            message.textContent = text;
        }

        function updateDownloads() {
            const value = 55 * downloadProgress.game + 5 * downloadProgress.extras;
            progress(value, "Downloading game data…");
        }

        function errorStatus(error) {
            status.classList.add("error");
            message.textContent =
                "Unable to start Half-Life: Day One.\n\n" +
                (error?.stack || error?.message || String(error));
        }

        async function fetchWithProgress(url, label, weight, offset) {
            const response = await fetch(url, { mode: "cors", cache: "force-cache" });
            if (!response.ok) throw new Error(label + " failed to load (HTTP " + response.status + ").");

            const total = Number(response.headers.get("content-length")) || 0;
            if (!response.body || !total) {
                const data = new Uint8Array(await response.arrayBuffer());
                if (label === "Game data") downloadProgress.game = 1;
                else downloadProgress.extras = 1;
                updateDownloads();
                return data.buffer;
            }

            const reader = response.body.getReader();
            const chunks = [];
            let loaded = 0;
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                chunks.push(value);
                loaded += value.byteLength;
                const fraction = loaded / total;
                if (label === "Game data") downloadProgress.game = fraction;
                else downloadProgress.extras = fraction;
                updateDownloads();
            }

            const result = new Uint8Array(loaded);
            let position = 0;
            for (const chunk of chunks) {
                result.set(chunk, position);
                position += chunk.byteLength;
            }
            if (label === "Game data") downloadProgress.game = 1;
            else downloadProgress.extras = 1;
            updateDownloads();
            return result.buffer;
        }

        async function mountZip(fs, buffer) {
            const zip = await JSZip.loadAsync(buffer);
            const entries = Object.values(zip.files).filter(entry => !entry.dir);
            const total = entries.length;

            for (let i = 0; i < total; i++) {
                const entry = entries[i];
                const path = "/rodir/" + entry.name.replace(/^\/+/, "");
                const directory = path.split("/").slice(0, -1).join("/");
                if (directory) fs.mkdirTree(directory);
                fs.writeFile(path, await entry.async("uint8array"));
                if ((i & 7) === 0 || i === total - 1) {
                    progress(90 + 9 * ((i + 1) / total), "Extracting game files…");
                    await new Promise(requestAnimationFrame);
                }
            }
            return total;
        }

        async function main() {
            const timeout = setTimeout(() => {
                if (status.style.display !== "none") {
                    message.textContent += "\n\nStill loading after 20 seconds. The connection or device may be too slow for the 20s target.";
                }
            }, 20000);

            try {
                progress(0, "Downloading game data and starting engine…");

                const xash = new Xash3D({
                    canvas,
                    arguments: ["-developer", "1", "-console", "-windowed", "-ref", "webgl2"],
                    libraries: {
                        client: HLSDK_BASE + "cl_dll/client_emscripten_wasm32.wasm",
                        server: HLSDK_BASE + "dlls/hl_emscripten_wasm32.so"
                    },
                    filesMap: {
                        "xash.wasm": ENGINE_BASE + "xash.wasm",
                        "filesystem_stdio.wasm": ENGINE_BASE + "filesystem_stdio.wasm",
                        "libref_webgl2.wasm": ENGINE_BASE + "libref_webgl2.wasm",
                        "cl_dlls/menu_emscripten_wasm32.wasm":
                            ENGINE_BASE + "cl_dll/menu_emscripten_wasm32.wasm"
                    }
                });

                const gamePromise = fetchWithProgress(GAME_URL, "Game data", 55, 0);
                const extrasPromise = fetchWithProgress(EXTRAS_URL, "Xash3D extras", 5, 55);

                progress(60, "Loading Xash3D engine…");
                const enginePromise = xash.init().then(() => {
                    engineReady = true;
                });

                const [zipBuffer, extrasBuffer] = await Promise.all([
                    gamePromise,
                    extrasPromise
                ]);
                progress(60, engineReady ? "Preparing game files…" : "Game data ready — waiting for Xash3D…");
                await enginePromise;
                progress(90, "Xash3D ready — extracting game files…");

                const fs = xash.em.FS;
                fs.mkdirTree("/rodir");
                fs.mkdirTree("/rodir/valve");
                fs.mkdirTree("/rwdir");

                const fileCount = await mountZip(fs, zipBuffer);
                fs.writeFile("/rodir/valve/extras.pk3", new Uint8Array(extrasBuffer));
                fs.chdir("/rodir");

                progress(99, "Starting Half-Life…");
                await new Promise(requestAnimationFrame);

                // xash.main() starts the engine loop and normally does not return
                // until the game exits. Hide the launcher BEFORE calling it.
                progress(100, "Half-Life is ready!");
                clearTimeout(timeout);
                status.style.display = "none";

                const elapsed = ((performance.now() - startedAt) / 1000).toFixed(1);
                console.log("Starting Xash3D with " + fileCount + " game files in " + elapsed + "s.");
                await new Promise(requestAnimationFrame);
                xash.main();
            } catch (error) {
                clearTimeout(timeout);
                console.error(error);
                errorStatus(error);
            }
        }

        main();
    </script>
</body>
</html>
