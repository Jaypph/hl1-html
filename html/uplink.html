<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Half-Life: Uplink</title>
    <style>
        html, body, canvas { width: 100%; height: 100%; margin: 0; }
        body {
            overflow: hidden;
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
        }
        #status {
            position: fixed;
            z-index: 10;
            inset: 0;
            display: grid;
            place-items: center;
            background: #000;
            font-size: 16px;
            padding: 24px;
            text-align: center;
            white-space: pre-wrap;
        }
        #status.error { color: #ff8a8a; }
        canvas { display: block; }
    </style>
</head>
<body>
    <div id="status">Loading Half-Life: Uplink…</div>
    <canvas id="canvas"></canvas>

    <script type="module">
        import JSZip from "https://esm.sh/jszip@3.10.1";
        import { Xash3D } from "https://esm.sh/xash3d-fwgs@1.2.2";

        const status = document.getElementById("status");
        const canvas = document.getElementById("canvas");

        const ENGINE_BASE = "https://cdn.jsdelivr.net/npm/xash3d-fwgs@1.2.2/dist/";
        const HLSDK_BASE = "https://cdn.jsdelivr.net/npm/hlsdk-portable@0.1.3/dist/";

        function setStatus(message, error = false) {
            status.textContent = message;
            status.classList.toggle("error", error);
            status.style.display = "grid";
        }

        async function fetchArrayBuffer(url, label) {
            const response = await fetch(url, { mode: "cors", cache: "no-store" });
            if (!response.ok) {
                throw new Error(label + " failed to load (HTTP " + response.status + ").");
            }
            return response.arrayBuffer();
        }

        async function mountZip(fs, buffer) {
            const zip = await JSZip.loadAsync(buffer);
            const entries = Object.values(zip.files).filter(entry => !entry.dir);

            for (const entry of entries) {
                const path = "/rodir/" + entry.name.replace(/^\/+/, "");
                const directory = path.split("/").slice(0, -1).join("/");
                if (directory) fs.mkdirTree(directory);
                fs.writeFile(path, await entry.async("uint8array"));
            }

            return entries.length;
        }

        async function main() {
            try {
                setStatus("Downloading game data…");
                const [zipBuffer, extrasBuffer] = await Promise.all([
                    fetchArrayBuffer("https://files.catbox.moe/xvzvx8.zip", "Game data"),
                    fetchArrayBuffer(
                        ENGINE_BASE + "valve/extras.pk3",
                        "Xash3D extras"
                    )
                ]);

                setStatus("Preparing game files…");

                const xash = new Xash3D({
                    canvas,
                    arguments: [
                        "-developer", "1",
                        "-console",
                        "-windowed",
                        "-ref", "webgl2"
                    ],
                    libraries: {
                        client: HLSDK_BASE + "cl_dll/client_emscripten_wasm32.wasm",
                        server: HLSDK_BASE + "dlls/hl_emscripten_wasm32.so"
                    },
                    filesMap: {
                        "xash.wasm": ENGINE_BASE + "xash.wasm",
                        "filesystem_stdio.wasm": ENGINE_BASE + "filesystem_stdio.wasm",
                        "libref_webgl2.wasm": ENGINE_BASE + "libref_webgl2.wasm",
                        "cl_dlls/menu_emscripten_wasm32.wasm":
                            ENGINE_BASE + "cl_dll/menu_emscripten_wasm32.wasm"
                    }
                });

                setStatus("Starting Xash3D engine…");
                await xash.init();

                const fs = xash.em.FS;
                fs.mkdirTree("/rodir");
                fs.mkdirTree("/rodir/valve");
                fs.mkdirTree("/rwdir");

                const fileCount = await mountZip(fs, zipBuffer);
                fs.writeFile("/rodir/valve/extras.pk3", new Uint8Array(extrasBuffer));
                fs.chdir("/rodir");

                setStatus("Starting Half-Life: Uplink…");
                xash.main();

                setTimeout(() => {
                    status.style.display = "none";
                }, 1500);

                console.log("Xash3D started with " + fileCount + " game files.");
            } catch (error) {
                console.error(error);
                setStatus(
                    "Unable to start Half-Life: Uplink.\n\n" +
                    (error?.stack || error?.message || String(error)) +
                    "\n\nCheck the browser console for more details.",
                    true
                );
            }
        }

        main();
    </script>
</body>
</html>
